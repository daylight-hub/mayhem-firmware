name: Build firmware

# Manual build for a personal fork: compiles the firmware (HackRF One /
# PortaPack) in the same Docker image the official release uses, then uploads
# the firmware and a ready-to-copy SD-card archive as run artifacts. It does
# NOT create a GitHub Release, so it needs no special permissions or tags.
#
# Run it from the Actions tab (Run workflow), or it runs automatically on a
# push to the signal-survey branch. Artifacts appear at the bottom of the run.

on:
  workflow_dispatch:
  push:
    branches: [signal-survey]

jobs:
  build:
    runs-on: ubuntu-latest
    name: build (HackRF)
    permissions:
      contents: write   # needed to create the draft release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Git submodule update
        run: git submodule update --init --recursive

      - name: Get version
        id: version
        run: echo "version=$(cat .github/workflows/version.txt)" >> $GITHUB_OUTPUT

      - name: Build the Docker image
        run: docker build -t portapack-dev -f dockerfile-nogit .

      - name: Make build folder
        run: mkdir ${{ github.workspace }}/build

      - name: Run the build (HackRF One target)
        run: docker run -e VERSION_STRING=${{ steps.version.outputs.version }} -i -v ${{ github.workspace }}:/havoc portapack-dev

      - name: Prepare firmware ZIP
        run: |
          mkdir -p flashing/firmware
          cp build/hackrf/firmware/hackrf_usb/hackrf_usb.dfu flashing/firmware/hackrf_usb.dfu
          cp build/hackrf/firmware/hackrf_usb/hackrf_usb.bin flashing/firmware/hackrf_usb.bin
          zip -j firmware.zip build/firmware/portapack-mayhem-firmware.bin
          cd flashing && zip -r ../firmware.zip * && cd ..

      - name: Download world map (base map)
        run: wget -q https://github.com/portapack-mayhem/mayhem-firmware/releases/download/world_map/world_map.zip

      - name: Unzip world map into /ADSB
        run: unzip -o world_map.zip -d sdcard/ADSB

      - name: Build FT8 2048 world map
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 firmware/tools/generate_world_map_2048.bin.py sdcard/ADSB/world_map.jpg sdcard/ADSB/world_map_2048.bin

      # Detailed /OSM tiles (VA/MD/DC/WV by default). Opt-in: runs only when the
      # TILE_URL_TEMPLATE repo secret is set to a provider that allows bulk tiles
      # (NOT tile.openstreetmap.org). Tune the region/zoom with the OSM_* vars.
      - name: Build detailed OSM tiles (optional)
        continue-on-error: true   # maps are optional; never fail the firmware build
        env:
          TILE_URL_TEMPLATE: ${{ secrets.TILE_URL_TEMPLATE }}
          # Optional: only needed if your provider restricts the key to HTTP
          # origins. Set a TILE_REFERER secret to an allowed origin.
          TILE_REFERER: ${{ secrets.TILE_REFERER }}
          OSM_ZMIN: "6"
          OSM_ZMAX: "11"
          OSM_BBOX: "-83.7,36.5,-74.9,40.7"
          OSM_DELAY: "0.05"   # polite but quicker than the 0.2s default
        run: |
          if [ -z "$TILE_URL_TEMPLATE" ]; then
            echo "TILE_URL_TEMPLATE secret not set - skipping detailed OSM tiles."
          else
            # -u = unbuffered, so tile progress shows live in the log
            python3 -u firmware/tools/generate_osm_tiles.py \
              --out sdcard/OSM --bbox "$OSM_BBOX" --zmin "$OSM_ZMIN" --zmax "$OSM_ZMAX"
          fi

      - name: Create SD-card ZIP (firmware + APPS + maps)
        run: |
          mkdir -p sdcard/FIRMWARE sdcard/APPS
          cp build/firmware/portapack-mayhem-firmware.bin sdcard/FIRMWARE/portapack-mayhem_${{ steps.version.outputs.version }}.bin
          cp build/firmware/portapack-mayhem_OCI.ppfw.tar sdcard/FIRMWARE/mayhem_${{ steps.version.outputs.version }}_hackrf_OCI.ppfw.tar
          cp build/firmware/application/*.ppma sdcard/APPS
          cp build/firmware/standalone/*/*.ppmp sdcard/APPS
          cd sdcard && zip -r ../sdcard.zip . && cd ..

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-hackrf
          path: ./firmware.zip

      - name: Upload SD-card artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-hackrf
          path: ./sdcard.zip

      # Also publish a DRAFT release with the same files attached. Draft =
      # visible only to you until you hit publish; nothing goes public
      # automatically. Each run makes its own draft (tagged by run number).
      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Signal Survey build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          draft: true
          body: |
            Automated personal build of the Signal Survey firmware (HackRF One / PortaPack).

            - `firmware.zip` - flash the `.bin` with mayhem_flasher.bat.
            - `sdcard.zip` - unzip onto a FAT32 card (firmware + APPS + maps).

            Untested on hardware; build and bench-test before relying on it.
          files: |
            firmware.zip
            sdcard.zip
